<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resona</title>
    <script>
      // Set the colour mode before first paint so a dark system never flashes light
      try {
        var t = (JSON.parse(localStorage.getItem('resona_settings_v3')) || {}).theme || 'system';
        document.documentElement.dataset.mode = t === 'system'
          ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
